<!-- desktop-confirm-modal: подтверждение действий (сохранить/отменить) -->
<div id="desktopConfirmModal" class="modal" style="display: none;">
    <div class="modal-content exit-modal-content desktop-confirm-modal-content">
        <div class="modal-header desktop-confirm-modal-header">
            <h2 id="desktopConfirmModalTitle" class="desktop-confirm-modal-title">Сохранить изменения?</h2>
            <button class="modal-close" id="desktopConfirmModalClose" title="Закрыть">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="exit-modal-buttons desktop-confirm-modal-buttons">
            <button id="desktopConfirmDiscardBtn" class="button-color-lightgreen">
                <i data-lucide="save-off"></i>
                <span id="desktopConfirmDiscardLabel">Выйти</span>
            </button>
            <button id="desktopConfirmSaveBtn" class="button-color-yellow" style="display: none;">
                <i data-lucide="save"></i>
                <span id="desktopConfirmSaveLabel">Выйти</span>
            </button>
        </div>
    </div>
</div>

<!-- desktop-loading-modal: индикатор загрузки -->
<div id="desktopLoadingModal" class="modal" style="display: none;">
    <div class="modal-content desktop-loading-modal-content">
        <div class="desktop-loading-content">
            <div class="desktop-loading-spinner"></div>
            <div id="desktopLoadingModalText" class="desktop-loading-text">Загрузка...</div>
        </div>
    </div>
</div>
