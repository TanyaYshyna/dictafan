<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Главная — Диктанты</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style_color.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/style_index.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- FancyTree -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jquery.fancytree@2/dist/skin-lion/ui.fancytree.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery.fancytree@2.38.2/dist/jquery.fancytree-all-deps.min.js"></script>

</head>

<body class="page-index">
    <div class="topbar">
        <a href="/" class="logo-link">
        <img src="/static/icons/logo.svg" class="logo">
        </a>
        <div class="user-section" id="user-section">
            <!-- Для авторизованных пользователей (изначально скрыто) -->
            <div class="auth-buttons" style="display: none;">
                <!-- Кнопки логина и регистрации обрабатываются через UserManager -->
            </div>

            <!-- Для авторизованных пользователей (изначально скрыто) -->
            <div class="user-info" style="display: none;">
                <a href="/user/profile" class="username">
                    <div class="user-avatar-small"></div>
                    <span class="username-text"></span>
                </a>
                <div class="streak">
                    <i data-lucide="flame"></i> <span class="streak-days">0</span>
                </div>
                <div class="statistics-dropdown-wrapper">
                    <button id="showStatisticsBtn" class="statistics-btn" title="Статистика">
                        <i data-lucide="bar-chart-3"></i>
                        <span>Статистика</span>
                    </button>
                    <div class="statistics-dropdown" id="statisticsDropdown" style="display: none;">
                        <button class="statistics-dropdown-item" id="showGeneralStatisticsBtn">
                            <i data-lucide="activity"></i>
                            <span>Общая история работы</span>
                        </button>
                        <button class="statistics-dropdown-item" id="showDictationsReportBtn">
                            <i data-lucide="file-text"></i>
                            <span>Отчет о выполненных диктантах</span>
                        </button>
                    </div>
                </div>
                <button id="logoutBtn" class="logout-btn">Выйти</button>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <div class="panel-header-left">
        <h2>Список диктантов</h2>
            </div>
            <div class="panel-header-right">
                <!-- Ссылки на удаленные страницы убраны -->
            </div>
        </div>
        <div class="buttons-row">
            <div class="buttons-row-left">
                <div id="header-language-selector"></div> <!-- ← ЭТОТ ЭЛЕМЕНТ -->
                <!-- Выпадающий список -->
                <div class="tooltip-wrapper">
                    <div id="languageFilterControl"></div>
                    <select id="languageFilter" style="display: none;">
                        <option value="learning_to_native">Изучаемый ⇒ Родной</option>
                        <option value="learning_only">Только изучаемый</option>
                        <option value="all">Все языки</option>
                    </select>
                </div>
                <div class="tooltip-wrapper">
                    <button id="btnDeleteNode">
                        <i data-lucide="trash-2"></i>
                    </button>
                </div>
                <div class="tooltip-wrapper">
                    <button id="btnAddNode">
                        <i data-lucide="folder-plus"></i>
                    </button>
                </div>
            </div>
            <div class="buttons-row-left-right">
                <button id="importDictationBtn" title="Загрузить диктант из файла">
                    <i data-lucide="upload-cloud"></i>
                </button>
                <button id="newDictationBtn" onclick="newDictation()" title="Создать документ">
                    <i data-lucide="file-plus-2"></i>
                </button>
            </div>
        </div>


        <div id="container-tree-cards">
            <div id="leftPanel">
                <div id="treeContainer"></div>
            </div>
            <div id="resizer"></div>
            <div id="rightPanel">
                <div id="text_tree_branch" class="path-label">ветка дерева</div>
                <div id="content">
                    <!-- <div id="dictationList"></div> -->
                    <div id="dictationsGrid" class="shorts-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно редактора диктанта -->
    <div id="dictationEditorModal" class="dictation-editor-modal" style="display: none;">
        <div class="dictation-editor-modal-content">
            <button id="dictationEditorCloseBtn" class="dictation-editor-modal-close" type="button" title="Закрыть">
                ×
            </button>
            <iframe id="dictationEditorFrame" class="dictation-editor-frame" src=""></iframe>
        </div>
    </div>

    <!-- Только общие данные -->
    <div id="global-config" data-categories-data='{{ categories_data | tojson }}' style="display: none;">
    </div>

    <!-- Для иконок -->
    <script src="{{ url_for('static', filename='js/lucide.js') }}"></script>
    <script> lucide.createIcons(); </script>

    <!-- Передаем данные категорий из сервера в JavaScript -->
    <script type="application/json" id="categories-data">
    {{ categories_data | tojson | safe }}
    </script>

    <script id="language-data" type="application/json">
    {{ language_data | tojson | safe }}
    </script>
    <script src="{{ url_for('static', filename='js/utils.js') }}"></script>
    <script src="{{ url_for('static', filename='js/language_manager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/user_manager.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth_interceptor.js') }}"></script>
    <script src="{{ url_for('static', filename='js/login_modal.js') }}"></script>
    <script src="{{ url_for('static', filename='js/language_selector.js') }}"></script>
    <script src="{{ url_for('static', filename='js/user_activity_history.js') }}"></script>
    <script src="{{ url_for('static', filename='js/statistics_report.js') }}"></script>
    <script src="{{ url_for('static', filename='js/dictations_report.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script_index.js') }}"></script>

</body>
