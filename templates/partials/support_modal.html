<div id="support-modal" class="modal" style="display: none;">
    <div class="modal-content statistics-modal-content" style="max-width: 520px;">
        <div class="statistics-header">
            <h2 id="supportModalTitle">Поддержать проект</h2>
            <button class="close-statistics-btn" id="closeSupportModalBtn" type="button" title="Закрыть">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="statistics-content" style="padding: 16px;">
            <div id="supportModalText" style="margin-bottom: 12px;"></div>
            <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                <button id="supportOpenJarBtn" class="button-color-yellow" type="button">
                    <i data-lucide="external-link"></i>
                    <span id="supportOpenJarBtnLabel">Открыть банку</span>
                </button>
                <button id="supportCopyJarLinkBtn" class="button-color-gray" type="button" title="Скопировать ссылку">
                    <i data-lucide="copy"></i>
                </button>
                <input id="supportJarLinkInput" type="text" readonly style="flex: 1; min-width: 220px;" value="">
            </div>
        </div>
    </div>
</div>
