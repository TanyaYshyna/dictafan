<!-- public-library-modal: публичная библиотека (глобальный поиск) -->
<div id="public-library-modal" class="modal" style="display: none;">
    <div class="modal-content public-library-modal-content">
        <div class="modal-header">
            <div class="library-modal-header-left">
                <i data-lucide="globe" class="library-modal-icon"></i>
                <button id="public-library-add" class="btn-new-book" type="button" aria-label="" title="">
                    <i data-lucide="book-plus"></i>
                </button>
            </div>
            <div id="publicBooksLanguageSelector" class="books-language-selector"></div>
            <h3></h3>
            <button class="modal-close" id="public-library-close" type="button" aria-label="" title="">
                <i data-lucide="x"></i>
            </button>
        </div>
        <div class="modal-body public-library-modal-body">
            <div class="public-library-content">
                <div class="public-books-zone">
                    <div class="books-list" id="publicBooksList"></div>
                </div>
            </div>
        </div>
    </div>
</div>
