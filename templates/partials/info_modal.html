<!-- info-modal: полезные ссылки (ресурсы автора и друзья) -->
<div id="info-modal" class="modal" style="display: none;">

        <div class="info-modal-header">

                <i data-lucide="x"></i>
            </button>
        </div>

        <div class="info-modal-body">
            <div class="info-modal-section">
                <h3 class="info-modal-section-title" id="infoModalMyResourcesTitle">{{ t('info_modal.my_resources', 'Мои ресурсы') }}</h3>
                <div class="info-modal-links">
                    <a class="info-modal-link" href="#" target="_blank" rel="noopener noreferrer">
                        <span class="info-modal-link-icon info-modal-link-icon--youtube" aria-hidden="true">

                    <a class="info-modal-link" href="#" target="_blank" rel="noopener noreferrer">

                        <i data-lucide="external-link" class="info-modal-link-ext"></i>
                    </a>

                    <a class="info-modal-link" href="#" target="_blank" rel="noopener noreferrer">
                        <span class="info-modal-link-icon info-modal-link-icon--instagram" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Instagram">
                                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>

                        <span class="info-modal-link-label">Instagram</span>

            <div class="info-modal-section">
                <h3 class="info-modal-section-title" id="infoModalFriendsTitle">{{ t('info_modal.friends', 'Друзья') }}</h3>
                <div class="info-modal-links">
                    <a class="info-modal-link" href="https://www.ratatype.ua/" target="_blank" rel="noopener noreferrer">
                        <img class="info-modal-link-logo" src="/static/icons/ratatype.png" alt="" aria-hidden="true">
                        <span class="info-modal-link-label">{{ t('info_modal.ratatype', 'Рататайп') }}</span>

                    <a class="info-modal-link" href="https://dailydictation.com/" target="_blank" rel="noopener noreferrer">

                        <span class="info-modal-link-label">{{ t('info_modal.dictations', 'Диктанты') }}</span>
                        <i data-lucide="external-link" class="info-modal-link-ext"></i>
                    </a>
